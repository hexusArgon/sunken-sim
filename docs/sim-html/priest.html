<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Priest — Sunken City sims</title><style>:root{--bg:#0d1117;--bg2:#161b22;--bg3:#1c2330;--border:#30363d;--fg:#e6edf3;--fg2:#9da7b3;--fg3:#6e7681;--success:#3fb950;--info:#58a6ff;--warning:#d29922;--danger:#f85149;--accent:#58a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.page{max-width:1180px;margin:0 auto;padding:20px 24px 60px}
.topnav{display:flex;gap:14px;align-items:center;padding:10px 24px;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:5;font-size:13px}
.topnav a{color:var(--fg2);text-decoration:none}.topnav a:hover,.topnav a.cur{color:var(--fg)}
.topnav a.cur{font-weight:600}
.h1{font-size:26px;margin:0;font-weight:650}.h2{font-size:19px;margin:6px 0 0;font-weight:620}.h3{font-size:15px;margin:4px 0 0;font-weight:600}
.text.small{font-size:12.5px}
.divider{border:0;border-top:1px solid var(--border);margin:6px 0;width:100%}
.pill{background:var(--bg2);color:var(--fg2);border:1px solid var(--border);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.pill:hover{color:var(--fg);border-color:#484f58}
.pill.active{background:rgba(88,166,255,.15);color:var(--fg);border-color:var(--accent)}
.pill.static{cursor:default}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.stat-value{font-size:22px;font-weight:600}.stat-label{color:var(--fg2);font-size:12px;margin-top:2px}
.callout{border:1px solid var(--border);border-left:3px solid var(--info);background:var(--bg2);border-radius:8px;padding:10px 14px}
.callout.warning{border-left-color:var(--warning)}.callout-title{font-weight:600;margin-bottom:4px}
.table-wrap{border:1px solid var(--border);border-radius:8px;overflow:auto}
.table-wrap.sticky{max-height:560px}.table-wrap.sticky th{position:sticky;top:0}
.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{background:var(--bg3);color:var(--fg2);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:6px 10px;border-bottom:1px solid #21262d;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl.striped tbody tr:nth-child(even){background:rgba(255,255,255,.025)}
.tbl tr.tone-success td{background:rgba(63,185,80,.09)}
.tbl tr.tone-success td:first-child{box-shadow:inset 3px 0 0 var(--success)}
.bars{display:flex;flex-direction:column;gap:6px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.bar-row{display:grid;grid-template-columns:minmax(120px,240px) 1fr 110px;gap:10px;align-items:center;font-size:13px}
.bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg2);text-align:right}
.bar-track{background:#21262d;border-radius:4px;height:16px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--info)}
.bar-fill.success{background:var(--success)}.bar-fill.warning{background:var(--warning)}
.bar-val{color:var(--fg);font-size:12.5px}
@media(max-width:800px){.grid-5{grid-template-columns:repeat(2,minmax(0,1fr))!important}.grid-2{grid-template-columns:1fr!important}.bar-row{grid-template-columns:110px 1fr 90px}}
